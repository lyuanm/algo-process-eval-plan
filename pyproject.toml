[project]
name = "algo-judge-hy3"
version = "1.0.0"
description = "基于 Hy3 的算法题「过程评估与错误定位」系统（犀牛鸟实战任务二）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
